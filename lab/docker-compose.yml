# Intentionally vulnerable practice targets. Everything binds to 127.0.0.1 only.
#   docker compose -f lab/docker-compose.yml up -d
# Then scope CyberRed to them (see lab/scope.lab.yaml). NEVER expose these on a shared network.
services:
  juice-shop:
    image: bkimminich/juice-shop
    ports: ["127.0.0.1:3000:3000"]
  dvwa:
    image: vulnerables/web-dvwa
    ports: ["127.0.0.1:8081:80"]
